<p>⚽ CAR FOOTBALL</p>

<input id="nameInput" placeholder="Dein Name">

SPIELEN
</button>

<div id="game">

</div>

MENÜ
</button>

</button>

</div>

<div id="boostFill"></div>
</div>
</div>

⚽ TOR! 💥
</div>

<div id="info">
WASD / Pfeile · Joystick · Boost
</div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

window.addEventListener("resize",()=>{

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;

});


/* =========================
   GAME
========================= */

let gameRunning=false;

let blueScore=0;
let orangeScore=0;

let goalLocked=false;
let goalTimer=null;

let keys={};

let boostPressed=false;
let boostAmount=100;

let particles=[];
let goalEffects=[];

const MARGIN=20;
const RADIUS=45;


/* =========================
   OBJECTS
========================= */

const player={
    x:0,
    y:0,
    r:27,
    vx:0,
    vy:0,
    color:"#2495ff"
};

const bot={
    x:0,
    y:0,
    r:27,
    vx:0,
    vy:0,
    color:"#ff8a22",
    stuckTimer:0
};

const ball={
    x:0,
    y:0,
    r:18,
    vx:0,
    vy:0
};


/* =========================
   INPUT
========================= */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){
        boostPressed=true;
    }

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.code==="Space"){
        boostPressed=false;
    }

});


/* =========================
   JOYSTICK
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

joystick.addEventListener("pointerdown",e=>{

    joyActive=true;

    joystick.setPointerCapture(e.pointerId);

});

joystick.addEventListener("pointermove",e=>{

    if(!joyActive)return;

    const rect=joystick.getBoundingClientRect();

    let x=e.clientX-(rect.left+rect.width/2);
    let y=e.clientY-(rect.top+rect.height/2);

    const max=42;

    let d=Math.hypot(x,y);

    if(d>max){

        x=x/d*max;
        y=y/d*max;

    }

    joyX=x/max;
    joyY=y/max;

    stick.style.left=(40+x)+"px";
    stick.style.top=(40+y)+"px";

});

joystick.addEventListener("pointerup",()=>{

    joyActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="40px";
    stick.style.top="40px";

});


/* =========================
   BOOST
========================= */

const boostButton=document.getElementById("boostButton");

boostButton.addEventListener("pointerdown",()=>{
    boostPressed=true;
});

boostButton.addEventListener("pointerup",()=>{
    boostPressed=false;
});

boostButton.addEventListener("pointercancel",()=>{
    boostPressed=false;
});


/* =========================
   START
========================= */

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("game").style.display="block";

    let name=document.getElementById("nameInput").value.trim();

    if(!name){
        name="Viki";
    }

    document.getElementById("playerName").textContent=name;

    blueScore=0;
    orangeScore=0;

    boostAmount=100;

    goalLocked=false;

    resetPositions(true);

    gameRunning=true;

    requestAnimationFrame(loop);
}


/* =========================
   RESET
========================= */

function resetPositions(first=false){

    player.x=W*.25;
    player.y=H*.5;

    player.vx=0;
    player.vy=0;


    bot.x=W*.75;
    bot.y=H*.5;

    bot.vx=0;
    bot.vy=0;

    bot.stuckTimer=0;


    ball.x=W*.5;
    ball.y=H*.5;


    /*
       Unterschiedlicher Anstoß
    */

    let direction=Math.random()<.5 ? -1 : 1;

    let angle=(Math.random()*.9)-.45;

    let speed=first ? 1.25 : 1.5+Math.random()*.5;

    ball.vx=Math.cos(angle)*speed*direction;

    ball.vy=Math.sin(angle)*speed;


    /*
       Niemals komplett gerade
    */

    if(Math.abs(ball.vy)<.25){

        ball.vy=Math.random()<.5 ? -.45 : .45;

    }

}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy--;

    if(keys["s"]||keys["arrowdown"])dy++;

    if(keys["a"]||keys["arrowleft"])dx--;

    if(keys["d"]||keys["arrowright"])dx++;

    dx+=joyX;
    dy+=joyY;

    let len=Math.hypot(dx,dy);

    if(len>1){

        dx/=len;
        dy/=len;

    }


    let speed=.45;

    if(boostPressed && boostAmount>0){

        speed=.88;

        boostAmount-=.8;

        if(boostAmount<0){
            boostAmount=0;
        }

        createBoostFlame();

    }else{

        boostAmount+=.20;

        if(boostAmount>100){
            boostAmount=100;
        }

    }


    player.vx+=dx*speed;
    player.vy+=dy*speed;

    player.vx*=.84;
    player.vy*=.84;

    player.x+=player.vx;
    player.y+=player.vy;

    keepInside(player);

}


/* =========================
   BOT
========================= */

function updateBot(){

    let targetX=ball.x;
    let targetY=ball.y;


    /*
       BOT AUS ECKEN HERAUSHALTEN
    */

    const nearLeft=ball.x<100;
    const nearRight=ball.x>W-100;
    const nearTop=ball.y<100;
    const nearBottom=ball.y>H-100;


    if(nearLeft || nearRight){

        if(ball.y<H/2){

            targetY+=85;

        }else{

            targetY-=85;

        }

    }


    if(nearTop || nearBottom){

        if(ball.x<W/2){

            targetX+=85;

        }else{

            targetX-=85;

        }

    }


    /*
       Wenn Bot direkt neben Ball hängt:
       Zielpunkt leicht hinter Ball setzen.
    */

    let dx=targetX-bot.x;
    let dy=targetY-bot.y;

    let distance=Math.hypot(dx,dy);

    if(distance<1){
        distance=1;
    }

    dx/=distance;
    dy/=distance;


    bot.vx+=dx*.12;
    bot.vy+=dy*.12;


    let maxSpeed=3.8;

    let speed=Math.hypot(bot.vx,bot.vy);

    if(speed>maxSpeed){

        bot.vx=bot.vx/speed*maxSpeed;
        bot.vy=bot.vy/speed*maxSpeed;

    }


    bot.vx*=.94;
    bot.vy*=.94;


    bot.x+=bot.vx;
    bot.y+=bot.vy;


    keepInside(bot);


    /*
       ANTI-STUCK:
       Wenn Bot sehr langsam ist und Ball
       gleichzeitig nahe an einer Wand liegt,
       bekommt er einen kräftigen Schubs
       Richtung Spielfeldmitte.
    */

    if(
        Math.abs(bot.vx)<.08 &&
        Math.abs(bot.vy)<.08 &&
        distance<80 &&
        (nearLeft||nearRight||nearTop||nearBottom)
    ){

        bot.stuckTimer++;

    }else{

        bot.stuckTimer=0;

    }


    if(bot.stuckTimer>18){

        let cx=W/2-bot.x;
        let cy=H/2-bot.y;

        let cd=Math.hypot(cx,cy);

        if(cd>1){

            bot.vx+=(cx/cd)*1.4;
            bot.vy+=(cy/cd)*1.4;

        }

        bot.stuckTimer=0;

    }

}


/* =========================
   KEEP INSIDE
========================= */

function keepInside(car){

    let left=MARGIN+car.r;
    let right=W-MARGIN-car.r;
    let top=MARGIN+car.r;
    let bottom=H-MARGIN-car.r;

    if(car.x<left){

        car.x=left;
        car.vx=Math.abs(car.vx)*.5;

    }

    if(car.x>right){

        car.x=right;
        car.vx=-Math.abs(car.vx)*.5;

    }

    if(car.y<top){

        car.y=top;
        car.vy=Math.abs(car.vy)*.5;

    }

    if(car.y>bottom){

        car.y=bottom;
        car.vy=-Math.abs(car.vy)*.5;

    }

}


/* =========================
   CAR COLLISION
========================= */

function carCollision(){

    let dx=bot.x-player.x;
    let dy=bot.y-player.y;

    let distance=Math.hypot(dx,dy);

    let minDistance=bot.r+player.r;

    if(distance<minDistance){

        if(distance<.01){
            distance=.01;
        }

        let nx=dx/distance;
        let ny=dy/distance;

        let overlap=minDistance-distance;

        player.x-=nx*overlap*.5;
        player.y-=ny*overlap*.5;

        bot.x+=nx*overlap*.5;
        bot.y+=ny*overlap*.5;


        let push=1.2;

        player.vx-=nx*push;
        player.vy-=ny*push;

        bot.vx+=nx*push;
        bot.vy+=ny*push;

        keepInside(player);
        keepInside(bot);

    }

}


/* =========================
   CAR BALL COLLISION
========================= */

function carBallCollision(car){

    let dx=ball.x-car.x;
    let dy=ball.y-car.y;

    let distance=Math.hypot(dx,dy);

    let minDistance=ball.r+car.r;

    if(distance<minDistance){

        if(distance<.01){
            distance=.01;
        }

        let nx=dx/distance;
        let ny=dy/distance;

        let overlap=minDistance-distance;

        ball.x+=nx*overlap;
        ball.y+=ny*overlap;


        let force=2.8;

        ball.vx+=nx*force+car.vx*.5;
        ball.vy+=ny*force+car.vy*.5;


        let speed=Math.hypot(ball.vx,ball.vy);

        let max=12;

        if(speed>max){

            ball.vx=ball.vx/speed*max;
            ball.vy=ball.vy/speed*max;

        }

    }

}


/* =========================
   BALL
========================= */

function updateBall(){

    ball.x+=ball.vx;
    ball.y+=ball.vy;

    ball.vx*=.992;
    ball.vy*=.992;


    /*
       OBEN / UNTEN
    */

    if(ball.y-ball.r<MARGIN){

        ball.y=MARGIN+ball.r;

        ball.vy=Math.abs(ball.vy)*.9;

    }

    if(ball.y+ball.r>H-MARGIN){

        ball.y=H-MARGIN-ball.r;

        ball.vy=-Math.abs(ball.vy)*.9;

    }


    /*
       TORERKENNUNG
       
       WICHTIG:
       goalLocked verhindert mehrfaches Zählen.
    */

    if(!goalLocked){

        /*
           Blaues Tor links
        */

        if(ball.x-ball.r<0){

            scoreGoal("orange");

            return;

        }


        /*
           Oranges Tor rechts
        */

        if(ball.x+ball.r>W){

            scoreGoal("blue");

            return;

        }

    }


    /*
       Seitenwände außerhalb des Torbereichs
    */

    const goalHeight=H*.32;

    const goalTop=(H-goalHeight)/2;
    const goalBottom=goalTop+goalHeight;


    if(ball.x-ball.r<MARGIN && ball.y<goalTop){

        ball.x=MARGIN+ball.r;
        ball.vx=Math.abs(ball.vx)*.9;

    }

    if(ball.x+ball.r>W-MARGIN && ball.y<goalTop){

        ball.x=W-MARGIN-ball.r;
        ball.vx=-Math.abs(ball.vx)*.9;

    }

    if(ball.x-ball.r<MARGIN && ball.y>goalBottom){

        ball.x=MARGIN+ball.r;
        ball.vx=Math.abs(ball.vx)*.9;

    }

    if(ball.x+ball.r>W-MARGIN && ball.y>goalBottom){

        ball.x=W-MARGIN-ball.r;
        ball.vx=-Math.abs(ball.vx)*.9;

    }

}


/* =========================
   TOR
========================= */

function scoreGoal(team){

    /*
       SOFORT sperren.
       Dadurch kann dieses Tor nur EINMAL
       gezählt werden.
    */

    if(goalLocked)return;

    goalLocked=true;

    if(team==="blue"){

        blueScore++;

    }else{

        orangeScore++;

    }


    document.getElementById("score").textContent=
        "🔵 "+blueScore+" : "+orangeScore+" 🟠";


    goalExplosion(ball.x,ball.y);

    showGoal();


    /*
       Ball und Spieler kurz einfrieren.
    */

    ball.vx=0;
    ball.vy=0;

    player.vx=0;
    player.vy=0;

    bot.vx=0;
    bot.vy=0;


    /*
       NUR EIN EINZIGER RESET.
    */

    clearTimeout(goalTimer);

    goalTimer=setTimeout(()=>{

        resetPositions();

        goalLocked=false;

    },1300);

}


/* =========================
   GOAL TEXT
========================= */

function showGoal(){

    const text=document.getElementById("goalText");

    text.style.opacity="1";
    text.style.transform=
        "translate(-50%,-50%) scale(1.15)";

    setTimeout(()=>{

        text.style.opacity="0";
        text.style.transform=
            "translate(-50%,-50%) scale(.5)";

    },850);

}


/* =========================
   EXPLOSION
========================= */

function goalExplosion(x,y){

    for(let i=0;i<55;i++){

        let angle=Math.random()*Math.PI*2;

        let speed=2+Math.random()*6;

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            life:45+Math.random()*35,

            size:3+Math.random()*5

        });

    }

}


/* =========================
   BOOST FLAME
========================= */

function createBoostFlame(){

    let speed=Math.hypot(player.vx,player.vy);

    if(speed<.2)return;

    let angle=Math.atan2(player.vy,player.vx);

    particles.push({

        x:player.x-Math.cos(angle)*25,
        y:player.y-Math.sin(angle)*25,

        vx:-Math.cos(angle)*(1+Math.random()*2),
        vy:-Math.sin(angle)*(1+Math.random()*2),

        life:15+Math.random()*10,

        size:4+Math.random()*5

    });

}


/* =========================
   PARTICLES
========================= */

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.96;
        p.vy*=.96;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


/* =========================
   DRAW FIELD
========================= */

function drawField(){

    ctx.clearRect(0,0,W,H);


    /*
       Rasen
    */

    ctx.fillStyle="#14833b";

    ctx.beginPath();

    ctx.roundRect(
        MARGIN,
        MARGIN,
        W-MARGIN*2,
        H-MARGIN*2,
        RADIUS
    );

    ctx.fill();


    /*
       Feldlinien
    */

    ctx.strokeStyle="#ffffffaa";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.roundRect(
        MARGIN,
        MARGIN,
        W-MARGIN*2,
        H-MARGIN*2,
        RADIUS
    );

    ctx.stroke();


    /*
       Mittellinie
    */

    ctx.beginPath();

    ctx.moveTo(W/2,MARGIN);
    ctx.lineTo(W/2,H-MARGIN);

    ctx.stroke();


    /*
       Mittelkreis
    */

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        75,
        0,
        Math.PI*2
    );

    ctx.stroke();


    /*
       Tore
    */

    const goalHeight=H*.32;
    const goalTop=(H-goalHeight)/2;


    ctx.fillStyle="#2495ff55";

    ctx.fillRect(
        0,
        goalTop,
        MARGIN+5,
        goalHeight
    );


    ctx.fillStyle="#ff8a2255";

    ctx.fillRect(
        W-MARGIN-5,
        goalTop,
        MARGIN+5,
        goalHeight
    );


    /*
       Torpfosten
    */

    ctx.strokeStyle="#fff";
    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(MARGIN,goalTop);
    ctx.lineTo(MARGIN,goalTop+goalHeight);

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(W-MARGIN,goalTop);
    ctx.lineTo(W-MARGIN,goalTop+goalHeight);

    ctx.stroke();

}


/* =========================
   DRAW CAR
========================= */

function drawCar(car){

    ctx.save();

    ctx.translate(car.x,car.y);

    let angle=Math.atan2(car.vy,car.vx);

    if(Math.hypot(car.vx,car.vy)>.1){

        ctx.rotate(angle);

    }


    /*
       Schatten
    */

    ctx.fillStyle="#0005";

    ctx.beginPath();

    ctx.ellipse(
        3,
        7,
        car.r,
        car.r*.65,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Auto
    */

    ctx.fillStyle=car.color;

    ctx.beginPath();

    ctx.roundRect(
        -car.r,
        -car.r*.65,
        car.r*2,
        car.r*1.3,
        12
    );

    ctx.fill();


    /*
       Fenster
    */

    ctx.fillStyle="#bdeaff";

    ctx.beginPath();

    ctx.roundRect(
        -car.r*.45,
        -car.r*.43,
        car.r*.9,
        car.r*.42,
        6
    );

    ctx.fill();


    /*
       Räder
    */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -car.r*.85,
        -car.r*.75,
        12,
        9
    );

    ctx.fillRect(
        car.r*.55,
        -car.r*.75,
        12,
        9
    );

    ctx.fillRect(
        -car.r*.85,
        car.r*.55,
        12,
        9
    );

    ctx.fillRect(
        car.r*.55,
        car.r*.55,
        12,
        9
    );

    ctx.restore();

}


/* =========================
   DRAW BALL
========================= */

function drawBall(){

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#111";
    ctx.lineWidth=3;

    ctx.stroke();


    ctx.fillStyle="#222";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=Math.max(0,p.life/60);

        ctx.fillStyle="#ffd166";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================
   UI
========================= */

function updateUI(){

    document.getElementById("boostFill").style.width=
        boostAmount+"%";

    document.getElementById("boostText").textContent=
        "BOOST: "+Math.round(boostAmount)+"%";

}


/* =========================
   LOOP
========================= */

function loop(){

    if(!gameRunning)return;


    if(!goalLocked){

        updatePlayer();
        updateBot();

        carCollision();

        carBallCollision(player);
        carBallCollision(bot);

        updateBall();

    }


    updateParticles();


    drawField();

    drawParticles();

    drawBall();

    drawCar(player);

    drawCar(bot);


    updateUI();


    requestAnimationFrame(loop);

}


/* =========================
   BACK TO MENU
========================= */

function backMenu(){

    gameRunning=false;

    clearTimeout(goalTimer);

    document.getElementById("game").style.display="none";
    document.getElementById("menu").style.display="flex";

    blueScore=0;
    orangeScore=0;

    goalLocked=false;

}

</script>

</body>
</html>
