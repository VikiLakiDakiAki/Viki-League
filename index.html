<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>VIKI LEAGUE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  touch-action:none;
  background:#101827;
  font-family:Arial,sans-serif;
}

button,input{
  touch-action:none;
}

#menu{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  background:linear-gradient(135deg,#101827,#172554);
}

#menu h1{
  margin:0 0 8px;
  font-size:clamp(42px,9vw,75px);
  text-shadow:0 5px 15px #000;
}

#menu p{
  color:#aaa;
  margin:5px;
}

#nameInput{
  width:220px;
  padding:14px;
  margin:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
  text-align:center;
  touch-action:auto;
  -webkit-user-select:text;
  user-select:text;
}

#play{
  border:0;
  border-radius:13px;
  padding:15px 35px;
  background:#22c55e;
  color:white;
  font-size:18px;
  font-weight:bold;
}

#game{
  display:none;
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#score{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 24px;
  border-radius:14px;
  background:#0009;
  color:white;
  font-size:26px;
  font-weight:bold;
  pointer-events:none;
}

#playerName{
  position:absolute;
  top:12px;
  left:12px;
  padding:8px 13px;
  border-radius:10px;
  background:#0009;
  color:white;
  pointer-events:none;
}

#back{
  position:absolute;
  top:10px;
  right:10px;
  padding:10px 16px;
  border:0;
  border-radius:10px;
  background:#0009;
  color:white;
  font-weight:bold;
  touch-action:none;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:#ffffff20;
  border:3px solid #ffffff55;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

#stick{
  position:absolute;
  left:42px;
  top:42px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#ffffffaa;
  pointer-events:none;
}

#boostButton{
  position:absolute;
  right:40px;
  bottom:90px;
  width:92px;
  height:92px;
  border-radius:50%;
  border:5px solid #ffffff55;
  background:#f59e0b;
  color:white;
  font-weight:bold;
  font-size:15px;
  touch-action:none;
}

#boostBox{
  position:absolute;
  right:25px;
  bottom:25px;
  width:140px;
  padding:7px;
  border-radius:10px;
  background:#0009;
  pointer-events:none;
}

#boostText{
  color:white;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

#boostBar{
  height:14px;
  margin-top:3px;
  background:#333;
  border-radius:8px;
  overflow:hidden;
}

#boostFill{
  height:100%;
  width:100%;
  background:#f59e0b;
}

#goalText{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%) scale(.5);
  color:white;
  font-size:clamp(40px,8vw,70px);
  font-weight:900;
  text-shadow:0 5px 20px #000;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

#info{
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
  color:#ffffff99;
  font-size:11px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="menu">
  <h1>VIKI LEAGUE</h1>
  <p>⚽ CAR FOOTBALL</p>

  <input id="nameInput"
         placeholder="Dein Name"
         autocomplete="off">

  <button id="play">SPIELEN</button>
</div>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="score">🔵 0 : 0 🟠</div>

  <div id="playerName">Viki</div>

  <button id="back">MENÜ</button>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="boostButton">BOOST</button>

  <div id="boostBox">
    <div id="boostText">BOOST: 100%</div>
    <div id="boostBar">
      <div id="boostFill"></div>
    </div>
  </div>

  <div id="goalText">⚽ TOR! 💥</div>

  <div id="info">Joystick · WASD / Pfeile · Boost</div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    devicePixelRatio,0,0,devicePixelRatio,0,0
  );
}

resize();
window.addEventListener("resize",resize);

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const play = document.getElementById("play");
const back = document.getElementById("back");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const boostButton = document.getElementById("boostButton");

const scoreText = document.getElementById("score");
const playerName = document.getElementById("playerName");

const boostText = document.getElementById("boostText");
const boostFill = document.getElementById("boostFill");
const goalText = document.getElementById("goalText");

let running = false;
let blueScore = 0;
let orangeScore = 0;

let keys = {};
let boostPressed = false;

let joyX = 0;
let joyY = 0;
let joyActive = false;
let joyPointer = null;

let boost = 100;
let goalTimer = 0;

const player = {
  x:0,y:0,r:27,
  vx:0,vy:0
};

const bot = {
  x:0,y:0,r:27,
  vx:0,vy:0
};

const ball = {
  x:0,y:0,r:18,
  vx:0,vy:0
};

/* --------------------
   TASTATUR
-------------------- */

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()] = true;

  if(e.code === "Space"){
    boostPressed = true;
    e.preventDefault();
  }
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;

  if(e.code === "Space"){
    boostPressed = false;
    e.preventDefault();
  }
});

/* --------------------
   JOYSTICK
-------------------- */

function moveJoystick(e){
  if(!joyActive) return;

  e.preventDefault();

  const rect = joystick.getBoundingClientRect();

  let x =
    e.clientX -
    (rect.left + rect.width / 2);

  let y =
    e.clientY -
    (rect.top + rect.height / 2);

  const max = 42;

  const distance = Math.hypot(x,y);

  if(distance > max){
    x = x / distance * max;
    y = y / distance * max;
  }

  joyX = x / max;
  joyY = y / max;

  stick.style.left = (42 + x) + "px";
  stick.style.top = (42 + y) + "px";
}

function resetJoystick(){
  joyActive = false;
  joyPointer = null;

  joyX = 0;
  joyY = 0;

  stick.style.left = "42px";
  stick.style.top = "42px";
}

joystick.addEventListener("pointerdown",e=>{
  e.preventDefault();

  joyActive = true;
  joyPointer = e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  moveJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
  e.preventDefault();

  if(e.pointerId === joyPointer){
    moveJoystick(e);
  }
});

joystick.addEventListener("pointerup",e=>{
  e.preventDefault();

  if(e.pointerId === joyPointer){
    resetJoystick();
  }
});

joystick.addEventListener("pointercancel",e=>{
  e.preventDefault();
  resetJoystick();
});

joystick.addEventListener("lostpointercapture",()=>{
  resetJoystick();
});

/* --------------------
   BOOST
-------------------- */

boostButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  boostPressed = true;
});

boostButton.addEventListener("pointerup",e=>{
  e.preventDefault();
  boostPressed = false;
});

boostButton.addEventListener("pointercancel",()=>{
  boostPressed = false;
});

/* --------------------
   START
-------------------- */

play.addEventListener("click",startGame);

function startGame(){

  menu.style.display = "none";
  game.style.display = "block";

  const name =
    document.getElementById("nameInput").value.trim()
    || "Viki";

  playerName.textContent = name;

  blueScore = 0;
  orangeScore = 0;

  boost = 100;

  updateScore();
  resetPositions();

  running = true;

  requestAnimationFrame(loop);
}

/* --------------------
   RESET
-------------------- */

function resetPositions(){

  player.x = W * .25;
  player.y = H * .5;

  player.vx = 0;
  player.vy = 0;

  bot.x = W * .75;
  bot.y = H * .5;

  bot.vx = 0;
  bot.vy = 0;

  ball.x = W * .5;
  ball.y = H * .5;

  const direction =
    Math.random() < .5 ? -1 : 1;

  const angle =
    (Math.random() * .8) - .4;

  ball.vx =
    Math.cos(angle) * 2.2 * direction;

  ball.vy =
    Math.sin(angle) * 2.2;
}

/* --------------------
   PLAYER
-------------------- */

function updatePlayer(){

  let dx = 0;
  let dy = 0;

  if(keys["w"] || keys["arrowup"])
    dy -= 1;

  if(keys["s"] || keys["arrowdown"])
    dy += 1;

  if(keys["a"] || keys["arrowleft"])
    dx -= 1;

  if(keys["d"] || keys["arrowright"])
    dx += 1;

  dx += joyX;
  dy += joyY;

  const length = Math.hypot(dx,dy);

  if(length > 1){
    dx /= length;
    dy /= length;
  }

  let speed = .55;

  if(boostPressed && boost > 0){

    speed = 1.0;

    boost -= .9;

    if(boost < 0)
      boost = 0;

  }else{

    boost += .25;

    if(boost > 100)
      boost = 100;
  }

  player.vx += dx * speed;
  player.vy += dy * speed;

  player.vx *= .82;
  player.vy *= .82;

  player.x += player.vx;
  player.y += player.vy;

  keepInside(player);
}

/* --------------------
   BOT
-------------------- */

function updateBot(){

  let dx = ball.x - bot.x;
  let dy = ball.y - bot.y;

  const distance = Math.hypot(dx,dy) || 1;

  dx /= distance;
  dy /= distance;

  bot.vx += dx * .13;
  bot.vy += dy * .13;

  const speed =
    Math.hypot(bot.vx,bot.vy);

  const maxSpeed = 3.8;

  if(speed > maxSpeed){
    bot.vx =
      bot.vx / speed * maxSpeed;

    bot.vy =
      bot.vy / speed * maxSpeed;
  }

  bot.vx *= .94;
  bot.vy *= .94;

  bot.x += bot.vx;
  bot.y += bot.vy;

  keepInside(bot);
}

/* --------------------
   GRENZEN
-------------------- */

function keepInside(car){

  const margin = 20;

  if(car.x < margin + car.r){
    car.x = margin + car.r;
    car.vx = Math.abs(car.vx) * .5;
  }

  if(car.x > W - margin - car.r){
    car.x = W - margin - car.r;
    car.vx = -Math.abs(car.vx) * .5;
  }

  if(car.y < margin + car.r){
    car.y = margin + car.r;
    car.vy = Math.abs(car.vy) * .5;
  }

  if(car.y > H - margin - car.r){
    car.y = H - margin - car.r;
    car.vy = -Math.abs(car.vy) * .5;
  }
}

/* --------------------
   AUTOS
-------------------- */

function carCollision(){

  const dx = bot.x - player.x;
  const dy = bot.y - player.y;

  const distance = Math.hypot(dx,dy);

  const minDistance =
    bot.r + player.r;

  if(distance < minDistance){

    const d = distance || .01;

    const nx = dx / d;
    const ny = dy / d;

    const overlap =
      minDistance - d;

    player.x -= nx * overlap / 2;
    player.y -= ny * overlap / 2;

    bot.x += nx * overlap / 2;
    bot.y += ny * overlap / 2;

    player.vx -= nx * .8;
    player.vy -= ny * .8;

    bot.vx += nx * .8;
    bot.vy += ny * .8;
  }
}

/* --------------------
   BALL
-------------------- */

function carBall(car){

  const dx = ball.x - car.x;
  const dy = ball.y - car.y;

  const distance = Math.hypot(dx,dy);

  const minDistance =
    ball.r + car.r;

  if(distance < minDistance){

    const d = distance || .01;

    const nx = dx / d;
    const ny = dy / d;

    const overlap =
      minDistance - d;

    ball.x += nx * overlap;
    ball.y += ny * overlap;

    ball.vx += nx * 2.8;
    ball.vy += ny * 2.8;

    ball.vx += car.vx * .45;
    ball.vy += car.vy * .45;

    const speed =
      Math.hypot(ball.vx,ball.vy);

    if(speed > 12){

      ball.vx =
        ball.vx / speed * 12;

      ball.vy =
        ball.vy / speed * 12;
    }
  }
}

function updateBall(){

  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.vx *= .992;
  ball.vy *= .992;

  const margin = 20;

  if(ball.y - ball.r < margin){

    ball.y = margin + ball.r;
    ball.vy = Math.abs(ball.vy) * .9;
  }

  if(ball.y + ball.r > H - margin){

    ball.y = H - margin - ball.r;
    ball.vy = -Math.abs(ball.vy) * .9;
  }

  const goalHeight = H * .34;
  const goalTop =
    (H - goalHeight) / 2;

  const goalBottom =
    goalTop + goalHeight;

  if(ball.x - ball.r < 0){

    if(ball.y > goalTop &&
       ball.y < goalBottom){

      scoreGoal("orange");
      return;
    }

    ball.x = margin + ball.r;
    ball.vx = Math.abs(ball.vx) * .9;
  }

  if(ball.x + ball.r > W){

    if(ball.y > goalTop &&
       ball.y < goalBottom){

      scoreGoal("blue");
      return;
    }

    ball.x = W - margin - ball.r;
    ball.vx = -Math.abs(ball.vx) * .9;
  }
}

/* --------------------
   TOR
-------------------- */

function scoreGoal(team){

  if(team === "blue")
    blueScore++;

  else
    orangeScore++;

  updateScore();

  goalText.style.opacity = "1";
  goalText.style.transform =
    "translate(-50%,-50%) scale(1)";

  clearTimeout(goalTimer);

  goalTimer = setTimeout(()=>{

    goalText.style.opacity = "0";

    goalText.style.transform =
      "translate(-50%,-50%) scale(.5)";

  },900);

  resetPositions();
}

function updateScore(){

  scoreText.textContent =
    "🔵 " + blueScore +
    " : " +
    orangeScore +
    " 🟠";
}

/* --------------------
   ZEICHNEN
-------------------- */

function drawField(){

  ctx.fillStyle = "#16803a";
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = "#ffffff88";
  ctx.lineWidth = 4;

  ctx.strokeRect(
    20,20,
    W-40,H-40
  );

  ctx.beginPath();
  ctx.moveTo(W/2,20);
  ctx.lineTo(W/2,H-20);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(
    W/2,H/2,
    Math.min(W,H)*.13,
    0,Math.PI*2
  );
  ctx.stroke();

  const goalHeight = H * .34;
  const top = (H-goalHeight)/2;

  ctx.fillStyle = "#2495ff55";
  ctx.fillRect(0,top,45,goalHeight);

  ctx.fillStyle = "#ff8a2255";
  ctx.fillRect(W-45,top,45,goalHeight);
}

function drawCar(car,color){

  ctx.save();

  ctx.translate(car.x,car.y);

  const angle =
    Math.atan2(car.vy,car.vx);

  if(Math.hypot(car.vx,car.vy) > .05)
    ctx.rotate(angle);

  ctx.fillStyle = "#111";
  ctx.fillRect(
    -28,-18,
    56,36
  );

  ctx.fillStyle = color;

  ctx.beginPath();
  ctx.roundRect(
    -25,-15,
    50,30,
    9
  );
  ctx.fill();

  ctx.fillStyle = "#dff6ff";

  ctx.fillRect(
    2,-11,
    16,22
  );

  ctx.fillStyle = "#111";

  ctx.fillRect(
    -24,-20,
    13,7
  );

  ctx.fillRect(
    -24,13,
    13,7
  );

  ctx.fillRect(
    12,-20,
    13,7
  );

  ctx.fillRect(
    12,13,
    13,7
  );

  ctx.restore();
}

function drawBall(){

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fillStyle = "white";
  ctx.fill();

  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = "#222";

  ctx.beginPath();
  ctx.arc(
    ball.x,
    ball.y,
    5,
    0,
    Math.PI*2
  );
  ctx.fill();
}

/* --------------------
   UI
-------------------- */

function updateUI(){

  boostFill.style.width =
    boost + "%";

  boostText.textContent =
    "BOOST: " +
    Math.round(boost) +
    "%";
}

/* --------------------
   SPIEL
-------------------- */

function loop(){

  if(!running) return;

  updatePlayer();
  updateBot();

  carCollision();

  carBall(player);
  carBall(bot);

  updateBall();

  drawField();

  drawCar(
    player,
    "#2495ff"
  );

  drawCar(
    bot,
    "#ff8a22"
  );

  drawBall();

  updateUI();

  requestAnimationFrame(loop);
}

/* --------------------
   MENÜ
-------------------- */

back.addEventListener("click",()=>{

  running = false;

  game.style.display = "none";
  menu.style.display = "flex";

  resetJoystick();
  boostPressed = false;
});

/* iPad-Schutz:
   verhindert Wischen/Scrollen
   während des Spiels */
document.addEventListener(
  "touchmove",
  e=>{
    if(game.contains(e.target)){
      e.preventDefault();
    }
  },
  {passive:false}
);

document.addEventListener(
  "gesturestart",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);


</script>

</body>
</html>
