<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Viki Football</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #18251d;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, #6da85c 0 5%, transparent 6%),
    radial-gradient(circle at 80% 30%, #5e9651 0 4%, transparent 5%),
    linear-gradient(#76b965 0 100%);
}

/* Hintergrund */
.tree {
  position: absolute;
  width: 55px;
  height: 80px;
  background: #315d32;
  border-radius: 50%;
  opacity: .55;
}

.tree::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 35px;
  background: #694b2b;
  left: 18px;
  top: 55px;
}

.t1 { left: 4%; top: 8%; }
.t2 { right: 5%; top: 12%; }
.t3 { left: 7%; bottom: 8%; }
.t4 { right: 8%; bottom: 10%; }

/* Spielfeld */
#field {
  position: absolute;
  left: 5%;
  top: 7%;
  width: 90%;
  height: 78%;
  border: 5px solid white;
  border-radius: 12px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.04) 0px,
      rgba(255,255,255,.04) 70px,
      rgba(0,0,0,.03) 70px,
      rgba(0,0,0,.03) 140px
    );
}

/* Mittellinie */
#field::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  width: 4px;
  height: 100%;
  background: rgba(255,255,255,.9);
  transform: translateX(-50%);
}

/* Mittelkreis */
#field::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 110px;
  height: 110px;
  border: 4px solid rgba(255,255,255,.9);
  border-radius: 50%;
  transform: translate(-50%,-50%);
}

/* Tore */
.goal {
  position: absolute;
  top: 37%;
  width: 65px;
  height: 26%;
  border: 4px solid white;
  background: rgba(255,255,255,.08);
  z-index: 3;
}

#leftGoal {
  left: -4px;
  border-left: 0;
}

#rightGoal {
  right: -4px;
  border-right: 0;
}

/* Pfosten */
.post {
  position: absolute;
  width: 13px;
  height: 13px;
  background: white;
  border-radius: 50%;
  z-index: 10;
  box-shadow: 0 1px 4px #333;
}

#post1 { left: -9px; top: 37%; }
#post2 { left: -9px; top: 63%; }
#post3 { right: -9px; top: 37%; }
#post4 { right: -9px; top: 63%; }

/* Latte – nur Deko */
.crossbar {
  position: absolute;
  width: 8px;
  height: 4px;
  background: white;
  z-index: 9;
}

#cross1 {
  left: -5px;
  top: 37%;
  width: 70px;
}

#cross2 {
  right: -5px;
  top: 37%;
  width: 70px;
}

/* Spieler */
.player {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  z-index: 20;
  border: 3px solid white;
  box-shadow: 0 3px 7px rgba(0,0,0,.35);
}

#player {
  background: #3478ff;
}

#bot {
  background: #ef4545;
}

/* Namen */
.name {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 13px;
  font-weight: bold;
  white-space: nowrap;
  text-shadow: 0 2px 3px #333;
}

/* Leben */
.hp {
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translate(-50%,-100%);
  width: 55px;
  height: 7px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
}

.hpbar {
  width: 100%;
  height: 100%;
  background: #35df57;
}

/* Ball */
#ball {
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border: 2px solid #222;
  border-radius: 50%;
  z-index: 25;
  box-shadow: 0 2px 4px rgba(0,0,0,.35);
}

/* Joystick */
#joystick {
  position: absolute;
  left: 25px;
  bottom: 25px;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(0,0,0,.20);
  border: 3px solid rgba(255,255,255,.45);
  z-index: 100;
}

#stick {
  position: absolute;
  left: 37px;
  top: 37px;
  width: 51px;
  height: 51px;
  border-radius: 50%;
  background: rgba(255,255,255,.8);
  box-shadow: 0 3px 8px rgba(0,0,0,.3);
}

/* Schuss */
#shoot {
  position: absolute;
  right: 30px;
  bottom: 35px;
  width: 85px;
  height: 85px;
  border-radius: 50%;
  background: rgba(255,255,255,.8);
  border: 4px solid rgba(0,0,0,.2);
  z-index: 100;
  font-size: 18px;
  font-weight: bold;
}

/* Score */
#score {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.45);
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-weight: bold;
  z-index: 200;
}
</style>
</head>

<body>

<div id="game">

  <div class="tree t1"></div>
  <div class="tree t2"></div>
  <div class="tree t3"></div>
  <div class="tree t4"></div>

  <div id="score">VIKI 0 : 0 BOT</div>

  <div id="field">

    <div id="leftGoal" class="goal"></div>
    <div id="rightGoal" class="goal"></div>

    <div id="post1" class="post"></div>
    <div id="post2" class="post"></div>
    <div id="post3" class="post"></div>
    <div id="post4" class="post"></div>

    <div id="cross1" class="crossbar"></div>
    <div id="cross2" class="crossbar"></div>

    <div id="player" class="player">
      <div class="name">VIKI</div>
      <div class="hp"><div id="playerHP" class="hpbar"></div></div>
    </div>

    <div id="bot" class="player">
      <div class="name">BOT</div>
      <div class="hp"><div id="botHP" class="hpbar"></div></div>
    </div>

    <div id="ball"></div>

  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shoot">⚽</button>

</div>

<script>
const field = document.getElementById("field");
const player = document.getElementById("player");
const bot = document.getElementById("bot");
const ball = document.getElementById("ball");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const shoot = document.getElementById("shoot");

let fw = 0;
let fh = 0;

let p = {x: 120, y: 250};
let b = {x: 500, y: 250};

let ballPos = {x: 320, y: 250};
let ballVel = {x: 0, y: 0};

let scorePlayer = 0;
let scoreBot = 0;

let joyX = 0;
let joyY = 0;
let touching = false;

const speed = 4.2;
const botSpeed = 2.1;
const ballFriction = 0.985;

function resize() {
  fw = field.clientWidth;
  fh = field.clientHeight;

  p.x = Math.min(Math.max(p.x, 25), fw - 25);
  p.y = Math.min(Math.max(p.y, 25), fh - 25);
  b.x = Math.min(Math.max(b.x, 25), fw - 25);
  b.y = Math.min(Math.max(b.y, 25), fh - 25);
}

window.addEventListener("resize", resize);
resize();

function draw() {
  player.style.left = (p.x - 21) + "px";
  player.style.top = (p.y - 21) + "px";

  bot.style.left = (b.x - 21) + "px";
  bot.style.top = (b.y - 21) + "px";

  ball.style.left = (ballPos.x - 10) + "px";
  ball.style.top = (ballPos.y - 10) + "px";
}

function clampPlayer() {
  p.x = Math.max(25, Math.min(fw - 25, p.x));
  p.y = Math.max(25, Math.min(fh - 25, p.y));
}

function movePlayer() {
  p.x += joyX * speed;
  p.y += joyY * speed;
  clampPlayer();
}

function moveBot() {

  let dx = ballPos.x - b.x;
  let dy = ballPos.y - b.y;

  let dist = Math.hypot(dx,dy);

  if (dist > 35) {
    b.x += (dx / dist) * botSpeed;
    b.y += (dy / dist) * botSpeed;
  }

  b.x = Math.max(25, Math.min(fw - 25, b.x));
  b.y = Math.max(25, Math.min(fh - 25, b.y));

  /* Bot soll Ball nicht in die Ecke schieben */
  if (
    ballPos.x < 28 ||
    ballPos.x > fw - 28 ||
    ballPos.y < 28 ||
    ballPos.y > fh - 28
  ) {
    ballVel.x *= -1.4;
    ballVel.y *= -1.4;

    ballPos.x = Math.max(32, Math.min(fw - 32, ballPos.x));
    ballPos.y = Math.max(32, Math.min(fh - 32, ballPos.y));
  }
}

function updateBall() {

  ballPos.x += ballVel.x;
  ballPos.y += ballVel.y;

  ballVel.x *= ballFriction;
  ballVel.y *= ballFriction;

  /* obere/untere Bande */
  if (ballPos.y < 10) {
    ballPos.y = 10;
    ballVel.y = Math.abs(ballVel.y);
  }

  if (ballPos.y > fh - 10) {
    ballPos.y = fh - 10;
    ballVel.y = -Math.abs(ballVel.y);
  }

  /* Pfosten */
  const posts = [
    {x: 4, y: fh*.37},
    {x: 4, y: fh*.63},
    {x: fw-4, y: fh*.37},
    {x: fw-4, y: fh*.63}
  ];

  for (const post of posts) {

    let dx = ballPos.x - post.x;
    let dy = ballPos.y - post.y;
    let d = Math.hypot(dx,dy);

    if (d < 18) {

      if (d === 0) d = 1;

      ballPos.x = post.x + dx/d * 19;
      ballPos.y = post.y + dy/d * 19;

      let dot = ballVel.x*(dx/d) + ballVel.y*(dy/d);

      ballVel.x -= 2 * dot * (dx/d);
      ballVel.y -= 2 * dot * (dy/d);

      ballVel.x *= 1.05;
      ballVel.y *= 1.05;
    }
  }

  /* Seitenwand – aber Toröffnung bleibt offen */
  const inGoalHeight =
    ballPos.y > fh*.37 &&
    ballPos.y < fh*.63;

  if (!inGoalHeight && ballPos.x < 10) {
    ballPos.x = 10;
    ballVel.x = Math.abs(ballVel.x);
  }

  if (!inGoalHeight && ballPos.x > fw-10) {
    ballPos.x = fw-10;
    ballVel.x = -Math.abs(ballVel.x);
  }

  /* Tor */
  if (ballPos.x < -10) {
    scoreBot++;
    resetBall();
  }

  if (ballPos.x > fw+10) {
    scorePlayer++;
    resetBall();
  }
}

function kick(fromX, fromY, power) {

  let dx = ballPos.x - fromX;
  let dy = ballPos.y - fromY;
  let d = Math.hypot(dx,dy);

  if (d < 65) {

    if (d === 0) d = 1;

    ballVel.x = (dx/d) * power;
    ballVel.y = (dy/d) * power;
  }
}

function playerKick() {
  kick(p.x,p.y,10);
}

function botKick() {

  let dx = ballPos.x - b.x;
  let dy = ballPos.y - b.y;
  let d = Math.hypot(dx,dy);

  if (d < 45) {

    /* Bot schießt Richtung linkes Tor */
    let targetX = 0;
    let targetY = fh/2;

    let tx = targetX-ballPos.x;
    let ty = targetY-ballPos.y;
    let td = Math.hypot(tx,ty);

    ballVel.x = (tx/td)*7;
    ballVel.y = (ty/td)*7;
  }
}

function resetBall() {

  ballPos.x = fw/2;
  ballPos.y = fh/2;

  ballVel.x = 0;
  ballVel.y = 0;

  p.x = fw*.25;
  p.y = fh*.5;

  b.x = fw*.75;
  b.y = fh*.5;

  document.getElementById("score").textContent =
    "VIKI " + scorePlayer + " : " + scoreBot + " BOT";
}

/* Joystick */

function joystickMove(clientX, clientY) {

  const r = joystick.getBoundingClientRect();

  let cx = r.left + r.width/2;
  let cy = r.top + r.height/2;

  let dx = clientX-cx;
  let dy = clientY-cy;

  let max = 37;
  let d = Math.hypot(dx,dy);

  if (d > max) {
    dx = dx/d*max;
    dy = dy/d*max;
  }

  joyX = dx/max;
  joyY = dy/max;

  stick.style.left = (37+dx) + "px";
  stick.style.top = (37+dy) + "px";
}

function joystickReset() {

  touching = false;

  joyX = 0;
  joyY = 0;

  stick.style.left = "37px";
  stick.style.top = "37px";
}

joystick.addEventListener("pointerdown", e => {
  touching = true;
  joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove", e => {
  if (touching) joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup", joystickReset);
joystick.addEventListener("pointercancel", joystickReset);
joystick.addEventListener("pointerleave", e => {
  if (touching) joystickMove(e.clientX,e.clientY);
});

shoot.addEventListener("pointerdown", e => {
  e.preventDefault();
  playerKick();
});

/* Hauptschleife */

function loop() {

  movePlayer();
  moveBot();

  updateBall();

  /* Ballkontakt mit Viki */
  let dp = Math.hypot(ballPos.x-p.x,ballPos.y-p.y);

  if (dp < 32) {

    let dx = ballPos.x-p.x;
    let dy = ballPos.y-p.y;
    let d = Math.max(1,Math.hypot(dx,dy));

    ballPos.x = p.x + dx/d*33;
    ballPos.y = p.y + dy/d*33;

    if (Math.abs(joyX)+Math.abs(joyY) > .1) {
      ballVel.x = joyX*4;
      ballVel.y = joyY*4;
    }
  }

  /* Ballkontakt mit Bot */
  let db = Math.hypot(ballPos.x-b.x,ballPos.y-b.y);

  if (db < 32) {
    botKick();
  }

  draw();

  requestAnimationFrame(loop);
}

draw();
loop();
</script>

</body>
</html>
