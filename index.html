<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Viki Football</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#17221a;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(#76b852 0 25%,#5d9f43 25% 100%);
}

/* Hintergrund */
.tree{
  position:absolute;
  width:45px;
  height:45px;
  background:#276b35;
  border-radius:50%;
  box-shadow:0 20px 0 -8px #68452c;
}

.t1{left:3%;top:8%}
.t2{right:5%;top:12%}
.t3{left:8%;bottom:5%}
.t4{right:9%;bottom:7%}

/* Spielfeld */
#field{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(94vw,1100px);
  height:min(78vh,650px);
  background:#42a94b;
  border:5px solid white;
  border-radius:8px;
  overflow:hidden;
}

/* Linien */
.line{
  position:absolute;
  background:rgba(255,255,255,.85);
}

.midline{
  width:4px;
  height:100%;
  left:50%;
  top:0;
  transform:translateX(-50%);
}

.circle{
  position:absolute;
  width:150px;
  height:150px;
  border:4px solid rgba(255,255,255,.85);
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.center{
  position:absolute;
  width:14px;
  height:14px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* Strafräume */
.penalty{
  position:absolute;
  width:120px;
  height:300px;
  top:50%;
  transform:translateY(-50%);
  border:4px solid white;
}

.leftPenalty{left:-4px}
.rightPenalty{right:-4px}

/* Tore */
.goal{
  position:absolute;
  top:50%;
  width:34px;
  height:170px;
  transform:translateY(-50%);
  background:rgba(240,240,240,.35);
  border:5px solid white;
  z-index:2;
}

.leftGoal{left:-36px}
.rightGoal{right:-36px}

/* Pfosten */
.post{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#eee;
  border:2px solid #aaa;
  z-index:10;
}

.leftPost1{left:-10px;top:calc(50% - 90px)}
.leftPost2{left:-10px;top:calc(50% + 76px)}
.rightPost1{right:-10px;top:calc(50% - 90px)}
.rightPost2{right:-10px;top:calc(50% + 76px)}

/* Latte nur Deko */
.crossbar{
  position:absolute;
  width:18px;
  height:185px;
  border:5px solid #eee;
  top:50%;
  transform:translateY(-50%);
  z-index:3;
}

.leftCross{left:-13px}
.rightCross{right:-13px}

/* Spieler */
.player{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  border:3px solid white;
}

#viki{
  background:#2478ff;
  box-shadow:0 3px 8px #1850aa;
}

#bot{
  background:#e63232;
  box-shadow:0 3px 8px #9c1d1d;
}

/* Ball */
#ball{
  position:absolute;
  width:22px;
  height:22px;
  background:white;
  border:2px solid #222;
  border-radius:50%;
  z-index:25;
  box-shadow:0 2px 4px #333;
}

/* Joystick */
#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:3px solid rgba(255,255,255,.5);
  z-index:100;
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:rgba(255,255,255,.8);
  box-shadow:0 3px 8px #333;
}

/* Schuss */
#shoot{
  position:fixed;
  right:35px;
  bottom:40px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#ffb000;
  border:5px solid white;
  font-size:20px;
  font-weight:bold;
  z-index:100;
  box-shadow:0 4px 10px #333;
}

#score{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.55);
  color:white;
  padding:8px 22px;
  border-radius:15px;
  font-size:24px;
  font-weight:bold;
  z-index:100;
}
</style>
</head>

<body>

<div id="game">

  <div class="tree t1"></div>
  <div class="tree t2"></div>
  <div class="tree t3"></div>
  <div class="tree t4"></div>

  <div id="score">0 : 0</div>

  <div id="field">

    <div class="line midline"></div>
    <div class="circle"></div>
    <div class="center"></div>

    <div class="penalty leftPenalty"></div>
    <div class="penalty rightPenalty"></div>

    <div class="goal leftGoal"></div>
    <div class="goal rightGoal"></div>

    <div class="crossbar leftCross"></div>
    <div class="crossbar rightCross"></div>

    <div class="post leftPost1"></div>
    <div class="post leftPost2"></div>
    <div class="post rightPost1"></div>
    <div class="post rightPost2"></div>

    <div id="viki" class="player">😎</div>
    <div id="bot" class="player">🤖</div>
    <div id="ball"></div>

  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="shoot">KICK</button>

</div>

<script>
const field = document.getElementById("field");
const viki = document.getElementById("viki");
const bot = document.getElementById("bot");
const ball = document.getElementById("ball");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const shoot = document.getElementById("shoot");
const scoreText = document.getElementById("score");

let fieldW, fieldH;

let vikiPos = {x:150,y:300};
let botPos  = {x:750,y:300};
let ballPos = {x:550,y:300};

let ballVel = {x:0,y:0};

let scoreViki = 0;
let scoreBot = 0;

let joyX = 0;
let joyY = 0;
let shooting = false;

function resize(){
  fieldW = field.clientWidth;
  fieldH = field.clientHeight;

  vikiPos.x = Math.min(vikiPos.x,fieldW-45);
  vikiPos.y = Math.min(vikiPos.y,fieldH-45);

  botPos.x = Math.min(botPos.x,fieldW-45);
  botPos.y = Math.min(botPos.y,fieldH-45);
}

window.addEventListener("resize",resize);
resize();

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

/* JOYSTICK */

let dragging=false;

function joystickMove(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  let x=clientX-(r.left+r.width/2);
  let y=clientY-(r.top+r.height/2);

  const max=35;
  const d=Math.hypot(x,y);

  if(d>max){
    x=x/d*max;
    y=y/d*max;
  }

  stick.style.left=(35+x)+"px";
  stick.style.top=(35+y)+"px";

  joyX=x/max;
  joyY=y/max;
}

joystick.addEventListener("pointerdown",e=>{
  dragging=true;
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
  if(dragging) joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",()=>{
  dragging=false;
  joyX=0;
  joyY=0;
  stick.style.left="35px";
  stick.style.top="35px";
});

/* SCHIESSEN */

shoot.addEventListener("pointerdown",()=>{
  kickBall();
});

function kickBall(){

  const dx=ballPos.x-(vikiPos.x+21);
  const dy=ballPos.y-(vikiPos.y+21);

  const d=Math.hypot(dx,dy);

  if(d<65){

    const nx=dx/(d||1);
    const ny=dy/(d||1);

    ballVel.x=nx*9;
    ballVel.y=ny*9;
  }
}

/* VIKI */

function updateViki(){

  const speed=4.5;

  vikiPos.x+=joyX*speed;
  vikiPos.y+=joyY*speed;

  vikiPos.x=clamp(vikiPos.x,0,fieldW-42);
  vikiPos.y=clamp(vikiPos.y,0,fieldH-42);
}

/* BOT KI */

function updateBot(){

  const dx=ballPos.x-(botPos.x+21);
  const dy=ballPos.y-(botPos.y+21);

  const d=Math.hypot(dx,dy);

  if(d>35){

    const speed=2.4;

    botPos.x+=dx/d*speed;
    botPos.y+=dy/d*speed;
  }

  botPos.x=clamp(botPos.x,25,fieldW-67);
  botPos.y=clamp(botPos.y,25,fieldH-67);

  /* Bot schießt Richtung Viki */
  if(d<48){

    const targetX=vikiPos.x+21;
    const targetY=vikiPos.y+21;

    const bx=targetX-ballPos.x;
    const by=targetY-ballPos.y;
    const bd=Math.hypot(bx,by)||1;

    ballVel.x=bx/bd*5;
    ballVel.y=by/bd*5;
  }
}

/* BALL */

function updateBall(){

  ballPos.x+=ballVel.x;
  ballPos.y+=ballVel.y;

  ballVel.x*=0.985;
  ballVel.y*=0.985;

  const r=11;

  /* obere/untere Bande */

  if(ballPos.y<r){
    ballPos.y=r;
    ballVel.y=Math.abs(ballVel.y);
  }

  if(ballPos.y>fieldH-r){
    ballPos.y=fieldH-r;
    ballVel.y=-Math.abs(ballVel.y);
  }

  /* Seiten + Pfosten */

  if(ballPos.x<r){

    const goalTop=fieldH/2-85;
    const goalBottom=fieldH/2+85;

    if(ballPos.y<goalTop || ballPos.y>goalBottom){
      ballPos.x=r;
      ballVel.x=Math.abs(ballVel.x);
    }
  }

  if(ballPos.x>fieldW-r){

    const goalTop=fieldH/2-85;
    const goalBottom=fieldH/2+85;

    if(ballPos.y<goalTop || ballPos.y>goalBottom){
      ballPos.x=fieldW-r;
      ballVel.x=-Math.abs(ballVel.x);
    }
  }

  /* Tor links */

  if(ballPos.x<-5 &&
     ballPos.y>fieldH/2-85 &&
     ballPos.y<fieldH/2+85){

    scoreBot++;
    resetBall();
  }

  /* Tor rechts */

  if(ballPos.x>fieldW+5 &&
     ballPos.y>fieldH/2-85 &&
     ballPos.y<fieldH/2+85){

    scoreViki++;
    resetBall();
  }

  /* Spieler schubst Ball */

  const vc={
    x:vikiPos.x+21,
    y:vikiPos.y+21
  };

  if(distance(vc,ballPos)<34){

    const dx=ballPos.x-vc.x;
    const dy=ballPos.y-vc.y;
    const d=Math.hypot(dx,dy)||1;

    ballVel.x+=dx/d*0.7;
    ballVel.y+=dy/d*0.7;
  }

  /* Bot berührt Ball */

  const bc={
    x:botPos.x+21,
    y:botPos.y+21
  };

  if(distance(bc,ballPos)<34){

    const dx=ballPos.x-bc.x;
    const dy=ballPos.y-bc.y;
    const d=Math.hypot(dx,dy)||1;

    ballVel.x+=dx/d*0.5;
    ballVel.y+=dy/d*0.5;
  }
}

function resetBall(){

  ballPos.x=fieldW/2;
  ballPos.y=fieldH/2;

  ballVel.x=0;
  ballVel.y=0;

  scoreText.textContent=scoreViki+" : "+scoreBot;
}

/* ZEICHNEN */

function draw(){

  viki.style.left=vikiPos.x+"px";
  viki.style.top=vikiPos.y+"px";

  bot.style.left=botPos.x+"px";
  bot.style.top=botPos.y+"px";

  ball.style.left=(ballPos.x-11)+"px";
  ball.style.top=(ballPos.y-11)+"px";
}

/* GAME LOOP */

function loop(){

  updateViki();
  updateBot();
  updateBall();
  draw();

  requestAnimationFrame(loop);
}

resetBall();
loop();
</script>

</body>
</html>
